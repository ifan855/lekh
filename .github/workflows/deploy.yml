name: Deploy to Netlify

# Optional: if you connect the repo in the Netlify UI instead, delete this workflow.
# Requires two repository secrets:
#   NETLIFY_AUTH_TOKEN  — a Netlify personal access token
#   NETLIFY_SITE_ID    — the site id (Site settings → General → API ID)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace @lekh/web

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: apps/web/.next
          site-id: ${{ secrets.NETLIFY_SITE_ID }}
          auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          deploy-message: "Deploy ${{ github.sha }}"
